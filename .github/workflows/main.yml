<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#eee;
  font:13px monospace;
  background:
    radial-gradient(circle at 15% 20%,#ff751855 0%,transparent 28%),
    radial-gradient(circle at 85% 15%,#8e44ad44 0%,transparent 30%),
    radial-gradient(circle at 70% 80%,#ff4b2040 0%,transparent 28%),
    radial-gradient(circle at 20% 85%,#5b168844 0%,transparent 32%),
    radial-gradient(circle at 50% 50%,#ff751810 0%,transparent 45%),
    linear-gradient(135deg,#050305 0%,#140814 45%,#050205 100%);
  background-attachment:fixed;
  min-height:100vh;
}

.p{
  padding:12px;
  background:
    linear-gradient(135deg,#0b070b 0%,#1a0a1a 50%,#090609 100%);
  border:1px solid #ff7518aa;
  border-radius:10px;
  box-shadow:
    0 0 8px #ff751855,
    0 0 20px #ff751833,
    0 0 45px #ff751822,
    0 0 80px #8e44ad18,
    inset 0 0 20px #ff751818,
    inset 0 0 45px #8e44ad12;
}

h2{
  margin:0 0 4px;
  color:#ff7518;
  letter-spacing:2px;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff7518,
    0 0 25px #ff4b20,
    0 0 45px #ff751855;
}

small{
  color:#998;
  text-shadow:0 0 6px #8e44ad88;
}

.info{
  margin:10px 0;
  padding:9px;
  background:#100c10;
  border:1px solid #ff751888;
  border-radius:7px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  font-size:10px;
  box-shadow:
    0 0 8px #ff751833,
    0 0 20px #8e44ad22,
    inset 0 0 15px #ff751811;
}

.info span,.info>b{
  padding:5px 7px;
  background:#171017;
  border-radius:4px;
  box-shadow:
    0 0 6px #ff751822,
    inset 0 0 8px #8e44ad18;
}

.info b{
  color:#ff9d38;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff751855;
}

.stats{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:8px 0
}

.stat{
  background:#160d16;
  padding:6px;
  border-radius:5px;
  border:1px solid #49334d;
  box-shadow:
    0 0 7px #8e44ad33,
    0 0 15px #ff751811,
    inset 0 0 10px #8e44ad18;
}

.stat b{
  color:#ff8c32;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff751855;
}

input,select,button{
  background:#120b12;
  color:#eee;
  border:1px solid #5b3b60;
  border-radius:5px;
  padding:7px;
  font:inherit;
  box-shadow:
    0 0 5px #8e44ad22,
    inset 0 0 7px #8e44ad12;
  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;
}

input:focus,select:focus{
  outline:none;
  border-color:#ff7518;
  box-shadow:
    0 0 6px #ff7518,
    0 0 15px #ff751855,
    0 0 30px #ff751822,
    inset 0 0 8px #ff751822;
}

button{
  cursor:pointer;
}

button:hover{
  border-color:#ff7518;
  box-shadow:
    0 0 7px #ff7518,
    0 0 15px #ff751855,
    0 0 30px #ff751822;
  transform:translateY(-1px);
}

.tools{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto auto;
  gap:5px;
  margin:8px 0
}

.calc{
  padding:9px;
  border:1px solid #ff751888;
  border-radius:7px;
  margin:8px 0;
  background:
    linear-gradient(135deg,#110b11,#190b19,#0d080d);
  box-shadow:
    0 0 8px #ff751833,
    0 0 20px #ff751822,
    0 0 40px #8e44ad18,
    inset 0 0 20px #ff751811;
}

.calc>b{
  color:#ff9d38;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff751855;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:8px;
  max-height:600px;
  overflow:auto;
  padding:4px;
}

.grid::-webkit-scrollbar{
  width:8px;
}

.grid::-webkit-scrollbar-track{
  background:#080508;
  border-radius:10px;
  box-shadow:inset 0 0 8px #8e44ad22;
}

.grid::-webkit-scrollbar-thumb{
  background:#ff7518aa;
  border-radius:10px;
  box-shadow:
    0 0 6px #ff7518,
    0 0 15px #ff751855;
}

.card{
  position:relative;
  background:
    linear-gradient(145deg,#160f16 0%,#100a10 55%,#170c17 100%);
  border:1px solid #49334d;
  border-radius:7px;
  padding:9px;
  text-align:center;
  transition:
    transform .2s,
    box-shadow .2s,
    border-color .2s;
  box-shadow:
    0 0 5px #8e44ad22,
    0 0 12px #ff751811,
    inset 0 0 12px #8e44ad0d;
}

.card:hover{
  transform:translateY(-3px) scale(1.015);
  border-color:#ff7518;
  box-shadow:
    0 0 7px #ff7518,
    0 0 15px #ff751888,
    0 0 30px #ff751844,
    0 0 55px #8e44ad33,
    inset 0 0 18px #ff751818;
}

.card img{
  width:75px;
  height:75px;
  object-fit:contain;
  filter:
    drop-shadow(0 0 4px #ff751866)
    drop-shadow(0 0 10px #8e44ad44);
  transition:
    filter .2s,
    transform .2s;
}

.card:hover img{
  transform:scale(1.05);
  filter:
    drop-shadow(0 0 6px #ff7518)
    drop-shadow(0 0 14px #ff7518aa)
    drop-shadow(0 0 25px #8e44ad66);
}

.title{
  font-weight:bold;
  margin:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:
    0 0 5px #ffffff22;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #29202b;
  padding:4px
}

.v{
  color:#ff8c32;
  font-weight:bold;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff751855,
    0 0 20px #ff4b2033;
}

.star{
  border:0;
  background:0;
  font-size:18px;
  color:#665b68;
  box-shadow:none;
  text-shadow:0 0 5px #8e44ad44;
}

.star:hover{
  color:#ffb52e;
  box-shadow:none;
  text-shadow:
    0 0 5px #ffb52e,
    0 0 12px #ffb52e,
    0 0 22px #ff751855;
}

.on{
  color:#ffb52e;
  text-shadow:
    0 0 5px #ffb52e,
    0 0 12px #ffb52e,
    0 0 25px #ff7518;
}

.r,.tag{
  position:absolute;
  top:5px;
  padding:2px 4px;
  font-size:8px;
  border-radius:3px;
  text-shadow:
    0 0 4px #fff8;
}

.r{
  right:5px;
  box-shadow:
    0 0 5px #8e44ad88,
    0 0 12px #8e44ad44;
}

.tag{
  left:5px;
  background:#ff4b20;
  box-shadow:
    0 0 5px #ff4b20,
    0 0 12px #ff4b2088,
    0 0 22px #ff4b2044;
}

.rise{
  background:#9b59b6;
  box-shadow:
    0 0 5px #9b59b6,
    0 0 12px #9b59b688;
}

/* 🌈 SUPER GLOW RAINBOW CHROMA */
.chroma{
  border-color:#ff0000;
  animation:
    chromaRainbow 3s linear infinite,
    chromaPulse 1.5s ease-in-out infinite;
}

@keyframes chromaRainbow{
  0%{
    border-color:#ff0000;
    box-shadow:
      0 0 6px #ff0000,
      0 0 15px #ff000088,
      0 0 30px #ff000044,
      inset 0 0 12px #ff000022;
  }

  16%{
    border-color:#ff7a00;
    box-shadow:
      0 0 6px #ff7a00,
      0 0 15px #ff7a0088,
      0 0 30px #ff7a0044,
      inset 0 0 12px #ff7a0022;
  }

  33%{
    border-color:#ffff00;
    box-shadow:
      0 0 6px #ffff00,
      0 0 15px #ffff0088,
      0 0 30px #ffff0044,
      inset 0 0 12px #ffff0022;
  }

  50%{
    border-color:#00ff00;
    box-shadow:
      0 0 6px #00ff00,
      0 0 15px #00ff0088,
      0 0 30px #00ff0044,
      inset 0 0 12px #00ff0022;
  }

  66%{
    border-color:#00ffff;
    box-shadow:
      0 0 6px #00ffff,
      0 0 15px #00ffff88,
      0 0 30px #00ffff44,
      inset 0 0 12px #00ffff22;
  }

  83%{
    border-color:#0066ff;
    box-shadow:
      0 0 6px #0066ff,
      0 0 15px #0066ff88,
      0 0 30px #0066ff44,
      inset 0 0 12px #0066ff22;
  }

  100%{
    border-color:#ff00ff;
    box-shadow:
      0 0 6px #ff00ff,
      0 0 15px #ff00ff88,
      0 0 30px #ff00ff44,
      inset 0 0 12px #ff00ff22;
  }
}

@keyframes chromaPulse{
  0%,100%{
    filter:brightness(1);
  }

  50%{
    filter:brightness(1.18);
  }
}

.ancient{
  border-color:#8e44ad;
  box-shadow:
    0 0 6px #8e44ad,
    0 0 15px #8e44ad55,
    0 0 28px #8e44ad22,
    inset 0 0 12px #8e44ad18;
}

.godly{
  border-color:#ff4fa3;
  box-shadow:
    0 0 6px #ff4fa3,
    0 0 15px #ff4fa355,
    0 0 28px #ff4fa322,
    inset 0 0 12px #ff4fa318;
}

.unique{
  border-color:#ffb52e;
  box-shadow:
    0 0 6px #ffb52e,
    0 0 15px #ffb52e55,
    0 0 28px #ffb52e22,
    inset 0 0 12px #ffb52e18;
}

.custom{
  border-color:#5a435e;
  box-shadow:
    0 0 6px #8e44ad66,
    0 0 15px #8e44ad33,
    inset 0 0 12px #8e44ad12;
}

.empty{
  text-align:center;
  padding:20px;
  color:#ff7518;
  text-shadow:
    0 0 6px #ff7518,
    0 0 15px #ff751855;
}

#total{
  margin:8px 0;
  color:#ff8c32;
  font-size:15px;
  text-shadow:
    0 0 5px #ff7518,
    0 0 12px #ff751855,
    0 0 25px #ff751822;
}

#list div{
  display:flex;
  justify-content:space-between;
  padding:4px;
  border-bottom:1px solid #29202b
}

#list button{
  padding:2px 6px;
}

@media(max-width:600px){
  .tools{grid-template-columns:1fr 1fr}
  .tools input{grid-column:1/-1}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

