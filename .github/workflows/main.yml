function render(){
let z=r.value,q=s.value.toLowerCase(),t=o.value;
let a=A.filter(x=>x[0].toLowerCase().includes(q)&&(z=="all"||x[1]==z)&&(!fo||F.includes(x[0])));
let v=x=>+x[2].replace(/,/g,"")||0;

a.sort((x,y)=>
t=="newest"?A.indexOf(y)-A.indexOf(x):
t=="oldest"?A.indexOf(x)-A.indexOf(y):
t=="high"?v(y)-v(x):
v(x)-v(y)
);

count.textContent=a.length;
hot.textContent=A.filter(x=>x[5]=="hot").length;
rise.textContent=A.filter(x=>x[5]=="rise").length;
fav.textContent=F.length;

x.innerHTML=a.map(a=>`<div class="card ${a[1]}">
<span class=r>${a[1]}</span>
${a[5]?`<span class="tag ${a[5]}">${a[5]=="hot"?"🔥 HOT":"📈 RISING"}</span>`:""}
<img src="${a[4]}">
<div class=title>${a[0]}</div>
<div class=row>Value:<b class=v>${a[2]}</b></div>
<div class=row>Demand:<span>${a[3]}</span></div>
<button class="star ${F.includes(a[0])?"on":""}" onclick="favItem('${encodeURIComponent(a[0])}',this)">★</button>
</div>`).join("")||"<div class=empty>🎃 No weapons found 👻</div>"
}

function favItem(n,b){
n=decodeURIComponent(n);
F=F.includes(n)?F.filter(x=>x!=n):[...F,n];
localStorage.krnFav=JSON.stringify(F);
b.classList.toggle("on");
fav.textContent=F.length
}

function add(){
let i=+ci.value,n=Math.max(1,+q.value),p=+A[i][2].replace(/,/g,"");
if(!p)return;
let e=C.find(x=>x.i==i);
e?e.q+=n:C.push({i,q:n});
draw()
}

function draw(){
let z=C.reduce((a,e)=>
  a+(+A[e.i][2].replace(/,/g,"")||0)*e.q,0);

total.innerHTML=`💀 TOTAL VALUE: <b>${z.toLocaleString()}</b>`;

list.innerHTML=C.map((e,i)=>
  `<div>${A[e.i][0]} × ${e.q}<button onclick="C.splice(${i},1);draw()">×</button></div>`
).join("")
}

function random(){
let a=A[Math.random()*A.length|0];
s.value=a[0];
r.value="all";
o.value="newest";
fo=0;
render()
}

ci.innerHTML=A.map((a,i)=>
  `<option value=${i}>${a[0]} — ${a[2]}</option>`
).join("");

draw();
render();
